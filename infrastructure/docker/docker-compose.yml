#################################
# Yugrow Platform — Local Development Infrastructure
# One command to start everything:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#################################

services:

  #################################
  # PostgreSQL
  #################################
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: yugrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yugrow
      POSTGRES_PASSWORD: yugrow_password
      POSTGRES_DB: yugrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yugrow"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################
  # Redis
  #################################
  redis:
    image: redis:7-alpine
    container_name: yugrow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  #################################
  # RabbitMQ
  #################################
  rabbitmq:
    image: rabbitmq:4-management
    container_name: yugrow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yugrow
      RABBITMQ_DEFAULT_PASS: yugrow_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  #################################
  # MinIO S3 Storage
  #################################
  minio:
    image: minio/minio
    container_name: yugrow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yugrow
      MINIO_ROOT_PASSWORD: yugrow_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  #################################
  # Mailpit
  #################################
  mailpit:
    image: axllent/mailpit
    container_name: yugrow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  #################################
  # Authentik PostgreSQL
  #################################
  authentik-postgres:
    image: postgres:17
    container_name: authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_password
      POSTGRES_DB: authentik
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data

  #################################
  # Authentik Redis
  #################################
  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped

  #################################
  # Authentik Server
  #################################
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2
    container_name: authentik-server
    restart: unless-stopped
    command:
      - server
    environment:
      AUTHENTIK_SECRET_KEY: change-this-secret
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
    ports:
      - "9443:9000"
    depends_on:
      authentik-postgres:
        condition: service_started
      authentik-redis:
        condition: service_started

  #################################
  # Authentik Worker
  #################################
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2
    container_name: authentik-worker
    restart: unless-stopped
    command:
      - worker
    environment:
      AUTHENTIK_SECRET_KEY: change-this-secret
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    depends_on:
      authentik-postgres:
        condition: service_started
      authentik-redis:
        condition: service_started

#################################
# Persistent Storage
#################################
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  authentik_postgres_data:
